name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # The test suite is written in TypeScript and run directly by Node, so it needs a Node new
  # enough for native type stripping (22.6+) and for --test to accept a glob (21+).
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # Compiling and running are different claims, so check the second one too.
      - run: node dist/cli.js --version

      - run: node dist/cli.js scan --json > /dev/null

      - run: node dist/cli.js gaps --json > /dev/null

      # Python is half the detectors and half the gaps, and every CI fixture above is this
      # repository -- which is TypeScript. Without this, a Python regression reaches a release.
      - name: Scan a Python fixture
        run: |
          mkdir -p /tmp/pyfix
          printf 'flask==3.0.0\nrequests==2.31.0\n' > /tmp/pyfix/requirements.txt
          cat > /tmp/pyfix/app.py <<'PY'
          import hashlib
          import pickle
          import random
          import string
          from flask import Flask, request

          app = Flask(__name__)

          @app.post("/login")
          def login():
              password = request.json["password"]
              pw = hashlib.sha256(password.encode()).hexdigest()
              token = "".join(random.choice(string.ascii_letters) for _ in range(32))
              cur.execute(f"INSERT INTO users (pw) VALUES ('{pw}')")
              state = pickle.loads(request.get_data())
              return {"token": token}

          app.run(debug=True)
          PY
          node dist/cli.js scan /tmp/pyfix --json > /tmp/scan.json
          node dist/cli.js gaps /tmp/pyfix --json > /tmp/gaps.json
          node -e "
            const scan = JSON.parse(require('fs').readFileSync('/tmp/scan.json', 'utf8'));
            const gaps = JSON.parse(require('fs').readFileSync('/tmp/gaps.json', 'utf8'));
            const found = scan.candidates.map((c) => c.detectorId);
            const missing = gaps.missing.map((m) => m.gapId);
            console.log('scan:', found.join(', ') || '(none)');
            console.log('gaps:', missing.join(', ') || '(none)');
            const wantScan = ['py-sql-injection', 'py-insecure-random', 'py-password-hashing', 'py-unsafe-deserialize'];
            for (const id of wantScan) {
              if (!found.includes(id)) { console.error('MISSING scan detector: ' + id); process.exit(1); }
            }
            for (const id of ['py-debug-enabled', 'py-no-production-server']) {
              if (!missing.includes(id)) { console.error('MISSING gap: ' + id); process.exit(1); }
            }
            // Cross-language isolation: a Python project must never receive JavaScript advice.
            for (const id of missing) {
              if (!id.startsWith('py-')) { console.error('JavaScript gap on a Python project: ' + id); process.exit(1); }
            }
            if (!gaps.profile.traits.includes('python')) { console.error('python trait not established'); process.exit(1); }
            console.log('python fixture OK');
          "

  # package.json declares node >=20.11, and what a consumer installs is the compiled dist/, not
  # the TypeScript sources. So the floor is verified against the published artefact: build it, then
  # run it. Running the .ts test suite here is impossible by design, not an omission.
  engine-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20.11'
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: node dist/cli.js --version

      - run: node dist/cli.js detectors

      - run: node dist/cli.js gap-list

      - run: node dist/cli.js scan --json > /dev/null

      - run: node dist/cli.js gaps --json > /dev/null

  # Dogfooding: CodeIsotope gates its own build on its own dependency audit. This job talks to
  # npm and GitHub, so it is allowed to fail without failing the build -- a rate limit or an
  # upstream outage is not a defect in this repository.
  self-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Audit our own dependencies
        env:
          # Raises the GitHub API limit from 60/hour to 5,000/hour.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node dist/cli.js audit --dev --fail-on replace

      # Offline, so this one is a genuine gate rather than best-effort.
      - name: Check our own missing infrastructure
        run: node dist/cli.js gaps --fail-on high

      # Proves the permalinks the binary emits actually resolve. A reference that 404s is worse
      # than no reference, and only a live request can catch that.
      - name: Verify emitted permalinks resolve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node dist/cli.js reference "retry exponential backoff" --package cockatiel --json > ref.json
          node -e "
            const r = JSON.parse(require('fs').readFileSync('ref.json', 'utf8'));
            const urls = r.sources.flatMap((s) => s.files.map((f) => f.url));
            if (urls.length === 0) { console.log('no permalinks emitted; nothing to verify'); process.exit(0); }
            (async () => {
              for (const url of urls) {
                const raw = url.replace('https://github.com/', 'https://raw.githubusercontent.com/').replace('/blob/', '/');
                const res = await fetch(raw);
                console.log(res.status + '  ' + url);
                if (!res.ok) process.exit(1);
              }
            })();
          "
