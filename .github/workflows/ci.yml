name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # The test suite is written in TypeScript and run directly by Node, so it needs a Node new
  # enough for native type stripping (22.6+) and for --test to accept a glob (21+).
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # Compiling and running are different claims, so check the second one too.
      - run: node dist/cli.js --version

      - run: node dist/cli.js scan --json > /dev/null

      - run: node dist/cli.js gaps --json > /dev/null

  # package.json declares node >=20.11, and what a consumer installs is the compiled dist/, not
  # the TypeScript sources. So the floor is verified against the published artefact: build it, then
  # run it. Running the .ts test suite here is impossible by design, not an omission.
  engine-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20.11'
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: node dist/cli.js --version

      - run: node dist/cli.js detectors

      - run: node dist/cli.js gap-list

      - run: node dist/cli.js scan --json > /dev/null

      - run: node dist/cli.js gaps --json > /dev/null

  # Dogfooding: CodeIsotope gates its own build on its own dependency audit. This job talks to
  # npm and GitHub, so it is allowed to fail without failing the build -- a rate limit or an
  # upstream outage is not a defect in this repository.
  self-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Audit our own dependencies
        env:
          # Raises the GitHub API limit from 60/hour to 5,000/hour.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node dist/cli.js audit --dev --fail-on replace

      # Offline, so this one is a genuine gate rather than best-effort.
      - name: Check our own missing infrastructure
        run: node dist/cli.js gaps --fail-on high
